<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="converter-card">

            <div class="header">
                <p class="tag">TEMPERATURE TOOL</p>
                <h1>Temperature Converter</h1>
                <p class="subtitle">
                    Convert temperatures between Celsius, Fahrenheit and Kelvin.
                </p>
            </div>

            <form id="converterForm">

                <div class="input-group">
                    <label for="temperature">Temperature</label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature"
                        step="any"
                        autocomplete="off"
                    >

                    <small id="errorMessage"></small>
                </div>

                <div class="input-group">
                    <label for="unit">Convert From</label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button type="submit" id="convertBtn">
                    Convert Temperature
                </button>

            </form>

            <div class="results" id="results">

                <div class="result-card">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-card">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-card">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>

            </div>

            <p class="info">
                Minimum temperature: −273.15 °C / 0 K
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
